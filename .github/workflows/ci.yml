name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows portable app
        run: npm run pack:win

      - name: Verify Windows executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/GokuGoku-win32-x64/GokuGoku.exe')) {
            throw 'Windows portable build did not create GokuGoku.exe.'
          }
